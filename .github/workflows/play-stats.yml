name: Refresh Play Store stats

# Scrapes the Google Play listing and updates the shields.io endpoint JSON in
# .github/badges/. The README badges read those files, so they stay live without
# any external API. Runs daily and on demand.
on:
  schedule:
    - cron: "17 6 * * *"   # daily ~06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape Play stats
        run: python3 .github/scripts/play_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- .github/badges; then
            git add .github/badges
            git commit -m "chore: refresh Google Play stats"
            git push
          else
            echo "No change."
          fi
